artifacts_root: artifacts

data_ingestion:
  root_dir: artifacts/data_ingestion
  # The raw dataset ships as two column-aligned halves that are joined here.
  source_file_1: data/raw/TelcomCustomer-Churn_1.csv
  source_file_2: data/raw/TelcomCustomer-Churn_2.csv
  id_column: customerID
  local_data_file: artifacts/data_ingestion/churn.csv

data_validation:
  root_dir: artifacts/data_validation
  data_file: artifacts/data_ingestion/churn.csv
  status_file: artifacts/data_validation/status.json

data_transformation:
  root_dir: artifacts/data_transformation
  data_file: artifacts/data_ingestion/churn.csv
  preprocessor_file: artifacts/data_transformation/preprocessor.joblib
  train_file: artifacts/data_transformation/train.csv
  test_file: artifacts/data_transformation/test.csv

model_trainer:
  root_dir: artifacts/model_trainer
  train_file: artifacts/data_transformation/train.csv
  preprocessor_file: artifacts/data_transformation/preprocessor.joblib
  model_file: artifacts/model_trainer/model.joblib

model_evaluation:
  root_dir: artifacts/model_evaluation
  test_file: artifacts/data_transformation/test.csv
  model_file: artifacts/model_trainer/model.joblib
  metrics_file: artifacts/model_evaluation/metrics.json
  mlflow_uri: ""

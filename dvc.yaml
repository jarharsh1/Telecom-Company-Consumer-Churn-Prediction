# Reproducible pipeline DAG. Run with `dvc repro`.

stages:
  data_ingestion:
    cmd: python -m churn.pipeline.stage_01_data_ingestion
    deps:
      - src/churn/pipeline/stage_01_data_ingestion.py
      - src/churn/components/data_ingestion.py
      - data/raw/TelcomCustomer-Churn_1.csv
      - data/raw/TelcomCustomer-Churn_2.csv
    outs:
      - artifacts/data_ingestion/churn.csv

  data_validation:
    cmd: python -m churn.pipeline.stage_02_data_validation
    deps:
      - src/churn/pipeline/stage_02_data_validation.py
      - src/churn/components/data_validation.py
      - artifacts/data_ingestion/churn.csv
      - schema.yaml
    outs:
      - artifacts/data_validation/status.json:
          cache: false

  data_transformation:
    cmd: python -m churn.pipeline.stage_03_data_transformation
    deps:
      - src/churn/pipeline/stage_03_data_transformation.py
      - src/churn/components/data_transformation.py
      - artifacts/data_ingestion/churn.csv
      # Gate training on validation, and track the feature contract so a schema
      # change regenerates the preprocessor/model/metrics.
      - artifacts/data_validation/status.json
      - schema.yaml
    params:
      - data_transformation.test_size
      - data_transformation.random_state
    outs:
      - artifacts/data_transformation/train.csv
      - artifacts/data_transformation/test.csv
      - artifacts/data_transformation/preprocessor.joblib

  model_trainer:
    cmd: python -m churn.pipeline.stage_04_model_trainer
    deps:
      - src/churn/pipeline/stage_04_model_trainer.py
      - src/churn/components/model_trainer.py
      - artifacts/data_transformation/train.csv
      - artifacts/data_transformation/preprocessor.joblib
    params:
      - model_trainer.n_estimators
      - model_trainer.learning_rate
      - model_trainer.max_depth
      - model_trainer.subsample
      - model_trainer.random_state
    outs:
      - artifacts/model_trainer/model.joblib

  model_evaluation:
    cmd: python -m churn.pipeline.stage_05_model_evaluation
    deps:
      - src/churn/pipeline/stage_05_model_evaluation.py
      - src/churn/components/model_evaluation.py
      - artifacts/data_transformation/test.csv
      - artifacts/model_trainer/model.joblib
    params:
      - model_evaluation.decision_threshold
    metrics:
      - artifacts/model_evaluation/metrics.json:
          cache: false
